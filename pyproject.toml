[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pope-tech-integrator"
version = "1.0.0"
description = "A complete Python wrapper and CLI for the Pope Tech accessibility API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# The MCP server requires Python 3.10+ (a constraint of the `mcp` SDK), so it
# lives in its own optional group rather than the base dependencies.
mcp = ["mcp>=1.2"]

[project.scripts]
pope-tech = "pope_tech.cli:main"
ptq = "pope_tech.query_cli:main"
pope-tech-mcp = "pope_tech.mcp_server:main"

[tool.setuptools]
packages = ["pope_tech"]
